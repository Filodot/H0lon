[project]
name = "h0lon"
version = "0.1.0.dev0"
description = "Все материалы учебной темы → один полный PDF-конспект → вариации"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Filodot" }]
keywords = ["notes", "study", "pdf", "latex", "pandoc", "claude-code", "codex"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Natural Language :: Russian",
  "Topic :: Education",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "platformdirs>=4.2",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "pymupdf>=1.24",
  "pypandoc-binary>=1.13",
  "python-pptx>=1.0.2",
  "trafilatura>=2.3.0",
  "pymupdf4llm>=1.28.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.scripts]
h0lon = "h0lon.cli:app"

[project.urls]
Repository = "https://github.com/Filodot/H0lon"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["h0lon"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.format]
# Code blocks in Markdown docs are illustrations, not code to keep formatted.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "needs_xelatex: requires a working XeLaTeX installation",
  "needs_browser: requires Edge/Chrome/Chromium for the HTML fallback",
  "live_agent: calls a real agent CLI (disabled unless H0LON_LIVE_AGENT=1)",
]
