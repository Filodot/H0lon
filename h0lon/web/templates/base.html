<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}H0lon{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ static('app.css') }}">
  <script src="{{ static('app.js') }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="/" aria-label="H0lon — темы"><span class="brand-mark" aria-hidden="true"></span>H0lon</a>
      <nav class="mainnav" aria-label="Разделы">
        <a href="/"{% if nav == 'topics' %} aria-current="page"{% endif %}>Темы</a>
        <a href="/queue"{% if nav == 'queue' %} aria-current="page"{% endif %}>Очередь</a>
        <a href="/doctor"{% if nav == 'doctor' %} aria-current="page"{% endif %} data-busy-link="Идёт проверка окружения…">Проверка окружения</a>
      </nav>
    </div>
  </header>
  <main class="wrap" id="main">
    {% if flashes %}
    <div class="flashes" role="status">
      {% for f in flashes %}<div class="flash flash-{{ f.level }}">{{ f.text }}</div>{% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap foot">
    <span>H0lon {{ version }}</span>
    <span class="muted">Локальный интерфейс без авторизации: не открывайте его в сеть.</span>
  </footer>
  <div class="toast" data-toast hidden role="status"></div>
  {% block overlay %}{% endblock %}
</body>
</html>
